<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000080">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Task List">
  <title>Task List</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="window">
    <header class="titlebar">
      <span class="title-app-name">Task List v1.1.7</span>
      <span id="titleListName" class="title-list-name"></span>
      <span class="title-buttons" aria-hidden="true">_ □ ×</span>
    </header>

    <nav class="menubar" aria-label="Application menu">
      <div class="menu-wrap">
        <button type="button" id="fileMenu" aria-haspopup="menu" aria-expanded="false">File</button>
        <div id="fileDropdown" class="menu-dropdown file-dropdown" role="menu" hidden></div>
      </div>

      <button type="button" id="importMenu">Import</button>

      <div class="menu-wrap">
        <button type="button" id="viewMenu" aria-haspopup="menu" aria-expanded="false">View</button>
        <div id="viewDropdown" class="menu-dropdown" role="menu" hidden>
          <button type="button" role="menuitemradio" data-view="open" aria-checked="true"><span class="menu-check">•</span>Open</button>
          <button type="button" role="menuitemradio" data-view="done" aria-checked="false"><span class="menu-check"></span>Done</button>
          <button type="button" role="menuitemradio" data-view="all" aria-checked="false"><span class="menu-check"></span>All</button>
        </div>
      </div>

      <button type="button" id="aboutMenu">Help</button>
    </nav>

    <section class="toolbar">
      <form id="newTaskForm">
        <label class="sr-only" for="newTaskTitle">New task</label>
        <input id="newTaskTitle" name="title" maxlength="500" autocomplete="off" placeholder="New task..." required>
        <button type="submit">Add Task</button>
      </form>
      <input type="file" id="markdownFile" accept=".md,.markdown,text/markdown,text/plain" hidden>
    </section>

    <section class="panel task-panel" aria-label="Tasks">
      <table class="task-table">
        <thead>
          <tr>
            <th class="id-col">ID</th>
            <th>Task</th>
            <th class="status-col">Status</th>
            <th class="actions-col">Actions</th>
          </tr>
        </thead>
        <tbody id="taskList"></tbody>
      </table>
      <div id="emptyState" class="empty-state">No open tasks.</div>
    </section>

    <footer class="statusbar">
      <span id="statusText">Ready</span>
      <span id="taskCount">0 tasks</span>
    </footer>
  </main>

  <dialog id="editDialog" class="retro-dialog">
    <form method="dialog" id="editForm">
      <div class="dialog-title">Edit Task</div>
      <div class="dialog-body">
        <div class="dialog-id">Task <strong id="editTaskId"></strong></div>
        <label for="editTitle">Title</label>
        <input id="editTitle" maxlength="500" required>
        <label for="editDescription">Description</label>
        <textarea id="editDescription" maxlength="4000" rows="7" placeholder="Optional"></textarea>
      </div>
      <div class="dialog-buttons">
        <button value="cancel" type="button" id="cancelEdit">Cancel</button>
        <button value="default" type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="subtaskDialog" class="retro-dialog">
    <form method="dialog" id="subtaskForm">
      <div class="dialog-title">Add Subtask</div>
      <div class="dialog-body">
        <div class="dialog-id">Parent Task <strong id="subtaskParentId"></strong></div>
        <label for="subtaskTitle">Title</label>
        <input id="subtaskTitle" maxlength="500" required>
        <label for="subtaskDescription">Description</label>
        <textarea id="subtaskDescription" maxlength="4000" rows="7" placeholder="Optional"></textarea>
      </div>
      <div class="dialog-buttons">
        <button value="cancel" type="button" id="cancelSubtask">Cancel</button>
        <button value="default" type="submit">Add</button>
      </div>
    </form>
  </dialog>

  <dialog id="infoDialog" class="retro-dialog info-dialog">
    <div class="dialog-title">Task Information</div>
    <div class="dialog-body info-body">
      <div class="dialog-id">Task <strong id="infoTaskId"></strong></div>
      <dl class="info-grid">
        <dt>Universal ID</dt><dd id="infoUniversalId"></dd>
        <dt>Title</dt><dd id="infoTitle"></dd>
        <dt>Description</dt><dd id="infoDescription" class="description-value"></dd>
        <dt>Status</dt><dd id="infoStatus"></dd>
        <dt>Created</dt><dd id="infoCreated"></dd>
        <dt>Last updated</dt><dd id="infoUpdated"></dd>
        <dt>Completed</dt><dd id="infoCompleted"></dd>
        <dt>Cancelled</dt><dd id="infoCancelled"></dd>
        <dt>Reopened</dt><dd id="infoReopened"></dd>
      </dl>
    </div>
    <div class="dialog-buttons">
      <button type="button" id="closeInfo">OK</button>
    </div>
  </dialog>

  <dialog id="listDialog" class="retro-dialog">
    <form method="dialog" id="listForm">
      <div class="dialog-title" id="listDialogTitle">Create a List</div>
      <div class="dialog-body">
        <label for="listName">Name</label>
        <input id="listName" maxlength="100" required>
        <label for="listDescription">Description</label>
        <textarea id="listDescription" maxlength="1000" rows="5" placeholder="Optional"></textarea>
      </div>
      <div class="dialog-buttons">
        <button value="cancel" type="button" id="cancelListEdit">Cancel</button>
        <button value="default" type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="manageListsDialog" class="retro-dialog manage-lists-dialog">
    <div class="dialog-title manage-lists-title"><span id="manageListsTitleText">Manage Lists</span><span id="manageListsUidTotal" class="manage-lists-uid-total">0 total entries</span></div>
    <div class="dialog-body manage-lists-body" id="manageListsBody"></div>
    <div class="dialog-buttons">
      <button type="button" id="closeManageLists">Close</button>
    </div>
  </dialog>

  <script src="/app.js" defer></script>
</body>
</html>
